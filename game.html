<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>אי החברזים</title>
    <meta name="description" content="משחק ידידותי לגיל 5-6: מטיילים באי, פותרים חידות קטנות ואוספים חברזים חמודים.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='18' r='11' fill='%234ea9ff'/%3E%3Ccircle cx='12' cy='16' r='2.6' fill='%23fff'/%3E%3Ccircle cx='20' cy='16' r='2.6' fill='%23fff'/%3E%3Ccircle cx='12' cy='16' r='1.3' fill='%23102040'/%3E%3Ccircle cx='20' cy='16' r='1.3' fill='%23102040'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap">
    <link rel="stylesheet" href="game.css">
</head>
<body>

<div class="sky" aria-hidden="true">
    <span class="cloud c1"></span>
    <span class="cloud c2"></span>
    <span class="cloud c3"></span>
</div>

<main class="game" id="game">

    <!-- ------------------------------------------------ מסך פתיחה -->
    <section class="screen screen-title is-on" id="screenTitle">
        <div class="title-art" id="titleArt" aria-hidden="true"></div>
        <h1 class="game-title">אי הַחַבְרֵזִים</h1>
        <p class="game-sub">טיילו באי, פתרו חידה קטנה &mdash; וקבלו חבר חדש!</p>
        <button class="big-btn play-btn" id="playBtn" type="button">
            <span class="btn-emoji" aria-hidden="true">▶</span> מַתְחִילִים
        </button>
        <button class="big-btn ghost-btn" id="albumBtnTitle" type="button">
            <span class="btn-emoji" aria-hidden="true">📔</span> הַחֲבֵרִים שֶׁלִּי
        </button>
        <button class="big-btn ghost-btn" id="heroBtn" type="button">
            <span class="btn-emoji" aria-hidden="true">🧒</span> <span id="heroBtnLabel">הַדְּמוּת שֶׁלִּי</span>
        </button>
        <div class="title-tools">
            <button class="tool" id="soundBtn" type="button" aria-pressed="true" title="צלילים">🔊</button>
            <button class="tool" id="voiceBtn" type="button" aria-pressed="true" title="הקראה">🗣️</button>
            <button class="tool" id="resetBtn" type="button" title="להתחיל מהתחלה">↺</button>
        </div>
    </section>

    <!-- ------------------------------------------------ מפת האי -->
    <section class="screen screen-map" id="screenMap">
        <header class="bar">
            <button class="tool" data-goto="title" type="button" title="חזרה">🏠</button>
            <p class="bar-title">לְאָן נֵלֵךְ?</p>
            <button class="tool" data-goto="album" type="button" title="האלבום שלי">📔</button>
        </header>
        <button class="big-btn walk-btn" id="walkBtn" type="button">
            <span class="btn-emoji" aria-hidden="true">🚶</span> לָצֵאת לְטִיּוּל
        </button>
        <div class="map-grid" id="mapGrid"></div>
        <p class="score-line" id="scoreLine"></p>
        <p class="care-line" id="careLine"></p>
        <p class="bag-line" id="bagLine"></p>
    </section>

    <!-- ------------------------------------------------ מפגש עם חברז -->
    <section class="screen screen-play" id="screenPlay">
        <header class="bar">
            <button class="tool" data-goto="map" type="button" title="חזרה למפה">🗺️</button>
            <p class="bar-title" id="areaName"></p>
            <button class="tool" id="repeatBtn" type="button" title="להגיד שוב">🔁</button>
        </header>

        <div class="stage" id="stage">
            <div class="creature-slot" id="creatureSlot"></div>
            <p class="speech" id="speech"></p>
        </div>

        <div class="puzzle" id="puzzle"></div>

        <div class="catch-zone" id="catchZone" hidden>
            <p class="catch-text">כָּל הַכָּבוֹד! זִרְקוּ אֶת כּוֹכַב הַחֲבֵרוּת</p>
            <button class="star-btn" id="starBtn" type="button" aria-label="לזרוק את הכוכב">⭐</button>
        </div>
    </section>

    <!-- ------------------------------------------------ יצירת הדמות -->
    <section class="screen screen-hero" id="screenHero">
        <header class="bar">
            <button class="tool" data-goto="title" type="button" title="חזרה">🏠</button>
            <p class="bar-title">מִי אַתֶּם?</p>
            <span class="tool tool-ghost" aria-hidden="true"></span>
        </header>

        <div class="hero-preview" id="heroPreview"></div>

        <label class="hero-name">
            <span>הַשֵּׁם שֶׁלִּי</span>
            <input type="text" id="heroName" maxlength="12" autocomplete="off" spellcheck="false">
        </label>

        <div class="hero-pickers" id="heroPickers"></div>

        <button class="big-btn" id="heroDone" type="button">
            <span class="btn-emoji" aria-hidden="true">✔</span> זֶה אֲנִי!
        </button>
    </section>

    <!-- ------------------------------------------------ טיול -->
    <section class="screen screen-walk" id="screenWalk">
        <header class="bar">
            <button class="tool" id="walkHome" type="button" title="הביתה">🏠</button>
            <p class="bar-title" id="walkTitle"></p>
            <span class="tool tool-ghost" id="walkCount"></span>
        </header>

        <div class="walk-scene" id="walkScene">
            <div class="walk-hills" aria-hidden="true"></div>
            <div class="walk-items" id="walkItems"></div>
            <div class="walkers" id="walkers"></div>
            <div class="walk-ground" aria-hidden="true"></div>
        </div>

        <p class="speech walk-speech" id="walkSpeech"></p>
        <div class="walk-end" id="walkEnd"></div>
    </section>

    <!-- ------------------------------------------------ טיפול בחברז -->
    <section class="screen screen-pet" id="screenPet">
        <header class="bar">
            <button class="tool" data-goto="album" type="button" title="חזרה לחברים">📔</button>
            <p class="bar-title" id="petName"></p>
            <button class="tool" data-goto="map" type="button" title="למפה">🗺️</button>
        </header>

        <div class="pet-stage" id="petStage">
            <div class="creature-slot" id="petSlot"></div>
            <p class="speech" id="petSpeech"></p>
        </div>

        <div class="meters" id="petMeters"></div>
        <div class="care-actions" id="careActions"></div>
        <div class="care-panel" id="carePanel"></div>
    </section>

    <!-- ------------------------------------------------ אלבום -->
    <section class="screen screen-album" id="screenAlbum">
        <header class="bar">
            <button class="tool" data-goto="map" type="button" title="חזרה">🗺️</button>
            <p class="bar-title">הַחֲבֵרִים שֶׁלִּי</p>
            <button class="tool" data-goto="title" type="button" title="הבית">🏠</button>
        </header>
        <div class="album-grid" id="albumGrid"></div>
        <p class="album-note" id="albumNote"></p>
    </section>

</main>

<div class="confetti" id="confetti" aria-hidden="true"></div>
<div class="flying-star" id="flyingStar" aria-hidden="true">⭐</div>

<script src="game.js"></script>
</body>
</html>
